name: Windows x64 preview
on:
  workflow_dispatch:
  push:
    # Both filters are required. GitHub does not run a push workflow for a ref the workflow
    # does not list: with only `branches` here, pushing a `v*` tag matches no filter and the
    # workflow simply never starts, so the tag-gated publish job below could never run.
    # https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#onpushbranchestagsbranches-ignoretags-ignore
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Set deterministic source timestamp
        shell: pwsh
        run: |
          $timestamp = git show -s --format=%ct $env:GITHUB_SHA
          if (-not $timestamp) { throw 'Could not determine the source commit timestamp.' }
          "SOURCE_DATE_EPOCH=$timestamp" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install dependencies
        run: npm ci
      - name: Frontend build and unit tests
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: VAL-02 synthetic fixture test
        run: npm run test:val02-fixtures
      # Runs before the browser tests so a Rust result is reported even when the flaky browser step fails.
      - name: Rust file-safety tests
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked 2>&1 | Tee-Object -FilePath rust-test-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The tail contains compiler/test diagnostics, not user files. Escape workflow-command
            # metacharacters so the entire bounded excerpt is one GitHub annotation.
            $tail = (Get-Content rust-test-output.txt -Tail 80) -join "`n"
            if ($tail.Length -gt 12000) { $tail = $tail.Substring($tail.Length - 12000) }
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Rust file-safety tests::$escaped"
          }
          exit $code
      - name: Install headless Chromium for UI tests
        run: npx playwright install --only-shell chromium
      - name: Browser UI regression tests on Windows
        shell: pwsh
        # Keep the full Playwright output so a failure can be diagnosed from the uploaded artifact.
        run: |
          npm run test:e2e 2>&1 | Tee-Object -FilePath e2e-output.txt
          exit $LASTEXITCODE
      - name: Report browser test failures as annotations
        if: ${{ failure() }}
        shell: pwsh
        run: |
          if (-not (Test-Path e2e-output.txt)) {
            Write-Output '::error title=Browser tests::No Playwright output was captured.'
            exit 0
          }
          $pattern = '^\s*\d+\)|Error|expect\(|Timeout|Expected|Received|failed'
          Get-Content e2e-output.txt | Select-String -Pattern $pattern | Select-Object -First 30 | ForEach-Object {
            $text = $_.Line.Trim() -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output ('::error title=Browser test failure::' + $text)
          }
      - name: Upload browser test output on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: Wrytrove-e2e-output-windows
          path: |
            e2e-output.txt
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare dependency SBOM and license gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item package-lock.json release/package-lock.json
          Copy-Item src-tauri/Cargo.lock release/Cargo.lock
          node scripts/release.mjs sbom release
      - name: Verify source version for a tagged build
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: node scripts/release.mjs verify-tag $env:GITHUB_REF_NAME
      - name: Build unsigned Windows installer
        shell: pwsh
        run: |
          npm run tauri build -- --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath installer-build-output.txt
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Get-Content installer-build-output.txt -Tail 30 | ForEach-Object {
              $text = $_.Trim() -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              if ($text) { Write-Output ('::error title=Windows installer build::' + $text) }
            }
          }
          exit $buildExit
      - name: Stage installer
        shell: pwsh
        run: node scripts/release.mjs stage-installers src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis release
      - name: Determine tagged-release signing mode
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: signing_mode
        shell: pwsh
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CREDENTIAL_ID: ${{ vars.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_CODESIGNTOOL_URL: ${{ vars.SSL_COM_CODESIGNTOOL_URL }}
          SSL_COM_CODESIGNTOOL_SHA256: ${{ vars.SSL_COM_CODESIGNTOOL_SHA256 }}
          MORROW_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.MORROW_SIGNING_CERTIFICATE_THUMBPRINT }}
          MORROW_SIGNING_REQUIRED: ${{ vars.MORROW_SIGNING_REQUIRED || 'false' }}
        run: |
          $hasAccount = -not [string]::IsNullOrWhiteSpace($env:SSL_COM_USERNAME) -and -not [string]::IsNullOrWhiteSpace($env:SSL_COM_PASSWORD)
          $hasThumbprint = -not [string]::IsNullOrWhiteSpace($env:MORROW_SIGNING_CERTIFICATE_THUMBPRINT)
          if ($env:MORROW_SIGNING_REQUIRED -eq 'true' -and -not $hasAccount) { throw 'Tagged release signing is required, but the SSL.com eSigner account secrets are not available.' }
          if ($hasThumbprint -and -not $hasAccount) { throw 'A publisher thumbprint is configured, but the SSL.com eSigner account secrets are not available.' }
          if ($hasAccount) {
            if (-not $hasThumbprint) { throw 'eSigner signing is configured but MORROW_SIGNING_CERTIFICATE_THUMBPRINT is missing.' }
            if ([string]::IsNullOrWhiteSpace($env:SSL_COM_TOTP_SECRET)) { throw 'eSigner signing is configured but SSL_COM_TOTP_SECRET is missing.' }
            if ([string]::IsNullOrWhiteSpace($env:SSL_COM_CREDENTIAL_ID)) { throw 'eSigner signing is configured but SSL_COM_CREDENTIAL_ID is missing.' }
            if ($env:SSL_COM_CODESIGNTOOL_URL -notlike 'https://*') { throw 'eSigner signing is configured but SSL_COM_CODESIGNTOOL_URL is not an https URL.' }
            if ($env:SSL_COM_CODESIGNTOOL_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'eSigner signing is configured but SSL_COM_CODESIGNTOOL_SHA256 is not a SHA-256 value.' }
            'configured=true' | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          } else {
            'configured=false' | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }
      # Signing uses SSL.com eSigner through CodeSignTool. The private key stays in SSL.com's HSM, so
      # no PFX is exported or stored here. The CodeSignTool archive is accepted only if its SHA-256
      # matches the pinned repository variable, and the signed result is checked for publisher and timestamp.
      - name: Sign and verify the tagged installer
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.signing_mode.outputs.configured == 'true' }}
        shell: pwsh
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CREDENTIAL_ID: ${{ vars.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_CODESIGNTOOL_URL: ${{ vars.SSL_COM_CODESIGNTOOL_URL }}
          SSL_COM_CODESIGNTOOL_SHA256: ${{ vars.SSL_COM_CODESIGNTOOL_SHA256 }}
          MORROW_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.MORROW_SIGNING_CERTIFICATE_THUMBPRINT }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
          Invoke-WebRequest -Uri $env:SSL_COM_CODESIGNTOOL_URL -OutFile $archive -UseBasicParsing
          $actualArchiveHash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash
          if ($actualArchiveHash -ne $env:SSL_COM_CODESIGNTOOL_SHA256.ToUpperInvariant()) { throw 'The CodeSignTool archive SHA-256 does not match SSL_COM_CODESIGNTOOL_SHA256.' }
          $toolDir = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Expand-Archive -Path $archive -DestinationPath $toolDir -Force
          $launcher = Get-ChildItem -Path $toolDir -Recurse -Filter 'CodeSignTool.bat' | Select-Object -First 1
          if (-not $launcher) { throw 'CodeSignTool.bat was not found in the verified archive.' }
          $expectedThumbprint = ($env:MORROW_SIGNING_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $report = @()
          Get-ChildItem release -Filter '*-setup.exe' | ForEach-Object {
            $outDir = Join-Path $env:RUNNER_TEMP ("signed-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            & $launcher.FullName sign "-credential_id=$env:SSL_COM_CREDENTIAL_ID" "-username=$env:SSL_COM_USERNAME" "-password=$env:SSL_COM_PASSWORD" "-totp_secret=$env:SSL_COM_TOTP_SECRET" "-output_dir_path=$outDir" "-input_file_path=$($_.FullName)"
            if ($LASTEXITCODE -ne 0) { throw "CodeSignTool sign failed for $($_.Name)." }
            $signedFile = Join-Path $outDir $_.Name
            if (-not (Test-Path $signedFile)) { throw "CodeSignTool did not produce a signed $($_.Name)." }
            Copy-Item -Path $signedFile -Destination $_.FullName -Force
            $signature = Get-AuthenticodeSignature -FilePath $_.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) { throw "Authenticode verification was not valid for $($_.Name)." }
            $actualThumbprint = ($signature.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
            if ($actualThumbprint -ne $expectedThumbprint) { throw "The signed publisher thumbprint for $($_.Name) does not match MORROW_SIGNING_CERTIFICATE_THUMBPRINT." }
            if (-not $signature.TimeStamperCertificate) { throw "The Authenticode signature for $($_.Name) has no trusted timestamp." }
            $report += "$($_.Name): Subject=$($signature.SignerCertificate.Subject); Thumbprint=$actualThumbprint; Timestamp=$($signature.TimeStamperCertificate.Subject)"
            Remove-Item -Path $outDir -Recurse -Force
          }
          'signed' | Set-Content -Encoding utf8 release/SIGNING-MODE.txt
          $report | Set-Content -Encoding utf8 release/SIGNATURE-VERIFICATION.txt
      - name: Mark the explicit unsigned preview mode
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || steps.signing_mode.outputs.configured != 'true' }}
        shell: pwsh
        run: |
          'unsigned-preview' | Set-Content -Encoding utf8 release/SIGNING-MODE.txt
          'No publisher certificate was configured for this preview. Windows may show an unknown-publisher warning.' | Set-Content -Encoding utf8 release/SIGNATURE-VERIFICATION.txt
      - name: Write release checksums and manifests
        shell: pwsh
        run: |
          node scripts/release.mjs checksums release
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/release.mjs winget release $env:GITHUB_REF_NAME
            node scripts/release.mjs manifest release $env:GITHUB_REF_NAME $env:GITHUB_SHA
          }
      # MSIX for Microsoft Store submission. Runs only when the Partner Center identity values are
      # configured. Output goes to msix-out/ and is uploaded as its own artifact, never into the
      # release folder, so the tag-only publish job cannot publish it. Unverified until a Windows run
      # has produced a package that passes Store validation.
      - name: Build MSIX for Store submission
        if: ${{ vars.MORROW_MSIX_IDENTITY_NAME != '' }}
        shell: pwsh
        env:
          MORROW_MSIX_IDENTITY_NAME: ${{ vars.MORROW_MSIX_IDENTITY_NAME }}
          MORROW_MSIX_PUBLISHER: ${{ vars.MORROW_MSIX_PUBLISHER }}
          MORROW_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MORROW_MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/msix.mjs check
          $kits = ${env:ProgramFiles(x86)}
          $makeappx = Get-ChildItem "$kits\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $makeappx) { throw 'Windows SDK makeappx.exe was not found.' }
          $layout = Join-Path $env:RUNNER_TEMP 'wrytrove-msix-layout'
          if (Test-Path $layout) { Remove-Item -Recurse -Force $layout }
          node scripts/msix.mjs layout src-tauri/target/x86_64-pc-windows-msvc/release/wrytrove-editor.exe src-tauri/icons/msix $layout
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force msix-out | Out-Null
          & $makeappx.FullName pack /d $layout /p "msix-out/Wrytrove_$version.0_x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx pack failed.' }
      - uses: actions/upload-artifact@v7
        if: ${{ vars.MORROW_MSIX_IDENTITY_NAME != '' }}
        with:
          name: Wrytrove-msix-unpublished
          path: msix-out
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Wrytrove-windows-x64-release
          path: release
          if-no-files-found: error

  # Publishing is a separate job so writable contents, attestation and OIDC permissions exist ONLY
  # on a tag push. The build job stays read-only, including on every pull request.
  publish:
    name: Attach the verified installer and provenance to the release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Wrytrove-windows-x64-release
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Refuse mismatched release inputs
        run: node scripts/release.mjs verify-release dist "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Create GitHub artifact provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*-setup.exe
            dist/package-lock.json
            dist/Cargo.lock
            dist/npm-sbom.cdx.json
            dist/cargo-metadata.json
      - name: Download offline provenance bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/attestations "$RUNNER_TEMP/wrytrove-attestations"
          for subject in dist/*-setup.exe dist/package-lock.json dist/Cargo.lock dist/npm-sbom.cdx.json dist/cargo-metadata.json; do
            name="${subject#dist/}"
            subject_dir="$RUNNER_TEMP/wrytrove-attestations/$name"
            mkdir -p "$subject_dir"
            for attempt in 1 2 3 4 5; do
              rm -f "$subject_dir"/sha256*.jsonl
              if (cd "$subject_dir" && gh attestation download "$GITHUB_WORKSPACE/$subject" --repo "$GITHUB_REPOSITORY" --predicate-type 'https://slsa.dev/provenance/v1'); then
                break
              fi
              if [[ "$attempt" == 5 ]]; then
                echo "Could not download the provenance bundle for $name" >&2
                exit 1
              fi
              sleep 5
            done
            mapfile -t bundles < <(find "$subject_dir" -maxdepth 1 -type f -name 'sha256*.jsonl' -print)
            if [[ "${#bundles[@]}" != 1 ]]; then
              echo "Expected one provenance bundle for $name, found ${#bundles[@]}" >&2
              exit 1
            fi
            cp "${bundles[0]}" "dist/attestations/$name.intoto.jsonl"
          done
      - name: Prepare transparent release notes
        shell: bash
        run: |
          set -euo pipefail
          mode="$(tr -d '\r\n' < dist/SIGNING-MODE.txt)"
          installer="$(find dist -maxdepth 1 -type f -name '*-setup.exe' -printf '%f\n' | head -n 1)"
          if [[ "$mode" == "signed" ]]; then
            trust='This installer is Authenticode-signed and the Windows build verified the publisher certificate and RFC 3161 timestamp.'
          else
            trust='This is an **unsigned-preview**. Windows may show an unknown-publisher SmartScreen warning; that warning is accurate.'
          fi
          cat > dist/RELEASE-NOTES.md <<EOF
          **Early preview, not a production release.** Keep backups and test with non-critical files first.

          $trust

          Verify the downloaded bytes with \`SHA256SUMS.txt\`. The release also includes CycloneDX/npm and Cargo dependency inventories, a license report, a release-specific winget manifest, and a GitHub artifact provenance attestation.

          Without Node, Rust or a GitHub token, verify the attached provenance bundle with \`gh attestation verify $installer --repo $GITHUB_REPOSITORY --bundle attestations/$installer.intoto.jsonl\`. Follow [the release verification guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/RELEASE-VERIFICATION.md) for checksum and publisher checks.

          Wrytrove has no automatic updater. To roll back, uninstall this preview from Windows Settings and install an earlier tagged release after verifying its own checksum and signing mode.
          EOF
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/npm-sbom.cdx.json
            dist/cargo-metadata.json
            dist/LICENSE-REPORT.json
            dist/RELEASE-MANIFEST.json
            dist/PROVENANCE.md
            dist/SIGNING-MODE.txt
            dist/SIGNATURE-VERIFICATION.txt
            dist/package-lock.json
            dist/Cargo.lock
            dist/attestations/*.intoto.jsonl
            dist/winget/*.yaml
          body_path: dist/RELEASE-NOTES.md
          prerelease: true
