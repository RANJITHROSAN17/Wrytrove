name: CI (TypeScript & Roadmap Gate)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Vitest & Roadmap Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate roadmap manifest
        run: node scripts/validate-roadmap.js .github/roadmap.json

      - name: Typecheck repo tooling (scripts/, VAL-02 fixtures, benchmarks/shared)
        run: npm run check:scripts

      - name: Static security boundary audit
        run: npm run audit:static

      - name: VAL-05 study kit privacy and fixture guard
        run: npm run study:check

      - name: VAL-02 synthetic fixture test
        run: npm run test:val02-fixtures

      - name: Unit tests (Vitest)
        run: npm test

      - name: Frontend production build
        run: npm run build

  rust:
    name: Rust file-safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # The mock-runtime IPC capability-boundary test is cfg(not(windows)); only a
      # Linux job can run it. System libraries are the documented Tauri v2 prerequisites.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev

      - name: Rust tests (including the IPC capability boundary)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked 2>&1 | tee rust-test-output.txt
        # The Linux job owns the only cfg(not(windows)) tests, so a failure here is otherwise
        # invisible from the job page. Surface a bounded excerpt the way the Windows job does.
      - name: Report Rust test failures as annotations
        if: ${{ failure() }}
        run: |
          if [ ! -f rust-test-output.txt ]; then
            echo '::error title=Rust tests::No cargo output was captured.'
            exit 0
          fi
          excerpt=$(tail -n 80 rust-test-output.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Rust tests::${excerpt}"

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --only-shell chromium

      - name: Browser regression suite
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.txt

      - name: Report browser test failures as annotations
        if: ${{ failure() }}
        run: |
          if [ ! -f e2e-output.txt ]; then
            echo '::error title=Browser tests::No Playwright output was captured.'
            exit 0
          fi
          # Surface a bounded, escaped excerpt so a failure can be diagnosed from the job page
          # without downloading the full log.
          excerpt=$(tail -n 60 e2e-output.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Browser tests::${excerpt}"
