name: Update README Benchmarks

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/update-readme-benchmarks.mjs
      - name: Open PR with updated README.md if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B chore/update-readme-benchmarks
            git add README.md
            git commit -m "docs(readme): update benchmark results [skip ci]"
            git push -f origin chore/update-readme-benchmarks
            gh pr create --base main --head chore/update-readme-benchmarks --title "docs(readme): update benchmark results" --body "Automated benchmark update from \`main\`." || true
          fi
